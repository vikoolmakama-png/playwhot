<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deposit | PLAYWHOT</title>
<link rel="stylesheet" href="/static/style.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #06452f, #03130e 75%);
    color: white;
    font-family: Arial, sans-serif;
}

.deposit-page {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 18px 15px 25px;
    text-align: center;
}

.deposit-logo {
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 12px;
    text-shadow: 0 0 15px #00ff99;
}

.deposit-logo span {
    color: #18efa0;
}

.deposit-title {
    font-size: 29px;
    margin: 12px 0 20px;
}

.account-card {
    width: 90%;
    max-width: 340px;
    margin: 0 auto 20px;
    padding: 20px 12px;
    border: 1px solid #16f5a0;
    border-radius: 18px;
    background: linear-gradient(145deg, #08432f, #05251c);
    box-shadow: 0 0 22px rgba(0,255,153,.22);
}

.bank-name {
    font-size: 15px;
    color: #d4f5e7;
}

.account-number {
    font-size: clamp(27px, 8vw, 34px);
    font-weight: 900;
    color: #20ffa5;
    margin: 15px 0;
    letter-spacing: 1px;
    text-shadow: 0 0 15px #00ff99;
}

.account-label {
    font-size: 13px;
    color: #b5d9c9;
}

.account-holder {
    font-size: 17px;
    overflow-wrap: anywhere;
    margin: 8px 0 15px;
}

.copy-button {
    background: transparent;
    border: 1px solid #18efa0;
    color: #20ffa5;
    padding: 10px 18px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.copy-button:active {
    background: #087b51;
}

.instructions {
    font-size: 12px;
    line-height: 1.5;
    color: #b9d8ca;
    margin: 12px 0 0;
}

.deposit-form {
    width: 100%;
}

.deposit-form input {
    display: block;
    width: 90%;
    max-width: 340px;
    height: 49px;
    margin: 0 auto 11px;
    padding: 0 13px;
    border: 1px solid #19d991;
    border-radius: 11px;
    background: #10232d;
    color: white;
    font-size: 14px;
    outline: none;
}

.deposit-form input:focus {
    border-color: #20ffa5;
    box-shadow: 0 0 12px rgba(0,255,153,.2);
}

.deposit-button {
    display: block;
    width: 90%;
    max-width: 340px;
    min-height: 49px;
    margin: 5px auto 12px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(90deg, #08d98b, #20ffa5);
    color: #03271b;
    font-size: 15px;
    font-weight: 900;
    box-shadow: 0 0 20px rgba(0,255,153,.25);
    cursor: pointer;
}

.back-button {
    display: block;
    width: 90%;
    max-width: 340px;
    margin: 0 auto;
    padding: 13px;
    border: 1px solid #168bd5;
    border-radius: 10px;
    background: #102c42;
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.message {
    color: #20ffa5;
    font-size: 13px;
    margin-top: 12px;
}

@media(max-height: 750px) {
    .deposit-page {
        padding-top: 9px;
    }

    .account-card {
        padding: 15px 10px;
        margin-bottom: 14px;
    }

    .deposit-title {
        margin: 8px 0 14px;
    }
}
</style>
</head>

<body>

<main class="deposit-page">

    <div class="deposit-logo">
        PLAY<span>WHOT</span> 🎴
    </div>

    <h1 class="deposit-title">💚 DEPOSIT</h1>

    <section class="account-card">

        <div class="bank-name">🏦 OPay Bank</div>

        <div class="account-number" id="accountNumber">
            8131602092
        </div>

        <div class="account-label">ACCOUNT NAME</div>

        <h3 class="account-holder">
            Elisha Makama Kamina
        </h3>

        <button type="button" class="copy-button" onclick="copyAccount()">
            📋 COPY ACCOUNT NUMBER
        </button>

        <p class="instructions">
            Transfer to this account, then enter the sender's
            name and amount below.
        </p>

    </section>

    <form method="POST" class="deposit-form">

        <input
            name="sender_name"
            type="text"
            placeholder="Sender's Account Name"
            required
        >

        <input
            name="amount"
            type="number"
            min="200"
            step="1"
            placeholder="Amount Sent (Minimum ₦200)"
            required
        >

        <button type="submit" class="deposit-button">
            💚 SUBMIT DEPOSIT
        </button>

    </form>

    <a href="/dashboard" class="back-button">
        ← BACK TO DASHBOARD
    </a>

    {% for message in get_flashed_messages() %}
    <p class="message">{{ message }}</p>
    {% endfor %}

</main>

<script>
function copyAccount() {
    const number = "8131602092";
    const button = document.querySelector(".copy-button");

    function copied() {
        button.textContent = "✓ ACCOUNT NUMBER COPIED!";
        setTimeout(() => {
            button.textContent = "📋 COPY ACCOUNT NUMBER";
        }, 2000);
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(number)
            .then(copied)
            .catch(() => fallbackCopy(number, button, copied));
    } else {
        fallbackCopy(number, button, copied);
    }
}

function fallbackCopy(number, button, copied) {
    const input = document.createElement("textarea");
    input.value = number;
    input.style.position = "fixed";
    input.style.opacity = "0";
    document.body.appendChild(input);
    input.select();

    try {
        if (document.execCommand("copy")) {
            copied();
        } else {
            button.textContent = "Copy failed. Select number manually.";
        }
    } catch (e) {
        button.textContent = "Copy failed. Select number manually.";
    }

    input.remove();
}
</script>

</body>
</html>
