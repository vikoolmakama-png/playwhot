<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withdraw | PLAYWHOT</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #075038, #03130e 75%);
    color: white;
    font-family: Arial, sans-serif;
}

.withdraw-page {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 18px 15px 25px;
    text-align: center;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    text-shadow: 0 0 15px #00ff99;
}

.logo span { color: #20ffa5; }

h1 {
    font-size: 28px;
    margin: 15px 0 20px;
}

.balance-card {
    width: 90%;
    max-width: 340px;
    margin: 0 auto 20px;
    padding: 17px;
    border: 1px solid #18efa0;
    border-radius: 16px;
    background: #073b2b;
    box-shadow: 0 0 20px #00ff9925;
}

.balance-card small {
    color: #b8dfce;
}

.balance-card h2 {
    color: #20ffa5;
    font-size: 30px;
    margin: 10px 0 0;
    text-shadow: 0 0 12px #00ff99;
}

form { width: 100%; }

input {
    display: block;
    width: 90%;
    max-width: 340px;
    height: 49px;
    margin: 0 auto 12px;
    padding: 0 14px;
    border: 1px solid #19d991;
    border-radius: 11px;
    background: #10232d;
    color: white;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #20ffa5;
    box-shadow: 0 0 12px #00ff9933;
}

.submit {
    display: block;
    width: 90%;
    max-width: 340px;
    min-height: 49px;
    margin: 5px auto 12px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(90deg, #08d98b, #20ffa5);
    color: #03271b;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 20px #00ff9940;
}

.back {
    display: block;
    width: 90%;
    max-width: 340px;
    margin: auto;
    padding: 14px;
    border: 1px solid #168bd5;
    border-radius: 10px;
    background: #102c42;
    color: white;
    text-decoration: none;
}

.message {
    color: #20ffa5;
    font-size: 13px;
    margin-top: 13px;
}

.note {
    color: #a9cabb;
    font-size: 12px;
    line-height: 1.5;
    margin: 15px auto;
    max-width: 340px;
}
</style>
</head>

<body>
<main class="withdraw-page">

    <div class="logo">PLAY<span>WHOT</span> 🎴</div>

    <h1>💸 WITHDRAW</h1>

    <div class="balance-card">
        <small>AVAILABLE BALANCE</small>
        <h2>₦{{ available_balance }}</h2>
    </div>

    <form method="POST">

        <input
            type="text"
            name="account_number"
            placeholder="Bank Account Number"
            inputmode="numeric"
            maxlength="20"
            required
        >

        <input
            type="text"
            name="account_name"
            placeholder="Account Holder's Name"
            required
        >

        <input
            type="text"
            name="bank_name"
            placeholder="Bank Name"
            required
        >

        <input
            type="number"
            name="amount"
            placeholder="Withdrawal Amount (₦)"
            min="1"
            step="1"
            required
        >

        <button class="submit" type="submit">
            💚 SUBMIT WITHDRAWAL
        </button>

    </form>

    <p class="note">
        Your withdrawal request will remain pending until an
        administrator reviews and approves it.
    </p>

    <a href="/dashboard" class="back">
        ← BACK TO DASHBOARD
    </a>

    {% for message in get_flashed_messages() %}
    <p class="message">{{ message }}</p>
    {% endfor %}

</main>
</body>
</html>
